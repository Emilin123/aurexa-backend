<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREXA — Twilight Interface</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#080b18;--panel:#10162a;--panel2:#151d35;--line:#273354;--gold:#e7bd71;--muted:#8b96b7;--cyan:#72d9d0;--violet:#9d8eff;--wine:#673c68;--white:#f5f2eb}*{box-sizing:border-box}body{margin:0;background:#050712;color:var(--white);font-family:'DM Sans',sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}.stage{min-height:100vh;background:radial-gradient(ellipse at 80% -10%,#21365d55,transparent 40%),radial-gradient(ellipse at 15% 90%,#3f245233,transparent 40%);display:flex;justify-content:center;padding:28px}.device{width:min(1210px,100%);min-height:730px;display:grid;grid-template-columns:250px 1fr;background:var(--ink);border:1px solid #27304d;border-radius:26px;overflow:hidden;box-shadow:0 30px 100px #000b,0 0 0 1px #ffffff08}.sidebar{background:linear-gradient(180deg,#0c1123,#090c19);padding:30px 20px;display:flex;flex-direction:column;border-right:1px solid #202a48}.brand{display:flex;gap:12px;align-items:center;margin-bottom:42px}.sigil{width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:20px}.brand strong{font:600 22px 'Playfair Display';letter-spacing:3px;display:block}.brand small{font-size:8px;letter-spacing:2px;color:var(--gold);display:block;margin-top:4px}.navlabel{font-size:10px;letter-spacing:2px;color:#64708e;margin:0 12px 12px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#8c96b5;text-align:left;padding:12px 13px;border-radius:11px;font-size:13px;display:flex;gap:13px;align-items:center}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#263253,#171e38);color:var(--white)}.nav button.active{box-shadow:inset 2px 0 var(--gold);color:var(--gold)}.nav i{width:20px;text-align:center;font-style:normal;font-size:17px}.sidebar .footer{margin-top:auto;font-size:10px;color:#59637f;line-height:1.6}.content{padding:32px 42px;max-width:960px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.crumb{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.top-actions{display:flex;gap:10px;align-items:center}.iconbtn{background:#111a30;border:1px solid #2b395c;width:38px;height:38px;border-radius:11px;color:#bbc6e2}.avatar{height:38px;padding:0 12px;border-radius:11px;background:#202b49;color:var(--cyan);font-size:12px}.view h1{font:600 clamp(30px,4vw,46px) 'Playfair Display';margin:0 0 8px;letter-spacing:-1px}.lead{margin:0;color:var(--muted);font-size:14px}.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:294px;background:linear-gradient(115deg,#1a2343,#261a36 65%,#391c3b);border:1px solid #394568;border-radius:20px;overflow:hidden;position:relative;margin:28px 0}.hero-copy{padding:34px;position:relative;z-index:1}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:2px;text-transform:uppercase}.hero h2{font:600 35px 'Playfair Display';line-height:1.08;margin:15px 0}.hero p{color:#abb4ca;max-width:330px;line-height:1.6;font-size:13px}.goldbtn{background:var(--gold);color:#191327;border-radius:9px;padding:12px 17px;font-weight:700;font-size:11px;letter-spacing:1px;margin-top:9px}.hero-art{position:absolute;right:0;top:0;width:48%;height:100%;overflow:hidden;background:radial-gradient(circle at 54% 40%,#72d9d044,transparent 28%),radial-gradient(circle at 54% 40%,#8e61b933,transparent 52%)}.orb{position:absolute;width:155px;height:205px;left:36%;top:29px;transform:rotate(16deg);border:1px solid #d4b66b99;border-radius:48% 52% 45% 55%;background:linear-gradient(140deg,#d3bc7777,#663a6b88 55%,#14233e);box-shadow:0 0 50px #7b63d855,inset 0 0 30px #fff2}.orb:before,.orb:after{content:'';position:absolute;background:#83e2d788;filter:blur(2px);clip-path:polygon(50% 0,100% 42%,69% 100%,23% 78%,0 30%)}.orb:before{width:55px;height:70px;left:44px;top:50px}.orb:after{width:26px;height:38px;left:92px;top:120px;background:#edc472aa}.orbit{position:absolute;inset:10px;border:1px solid #bb9ae644;border-radius:50%;transform:rotate(-35deg)}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat,.card{background:linear-gradient(145deg,#11182d,#0c1223);border:1px solid #263353;border-radius:15px;padding:20px}.stat small{display:block;color:#7985a4;font-size:10px;letter-spacing:1.5px}.stat strong{display:block;font:600 25px 'Playfair Display';margin-top:8px}.stat em{color:var(--cyan);font-style:normal;font-size:11px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.section-title h3{font:600 19px 'Playfair Display';margin:0}.section-title span{font-size:11px;color:var(--gold)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.art-card{height:116px;border-radius:12px;padding:15px;position:relative;overflow:hidden;background:linear-gradient(145deg,#29355a,#172039)}.art-card:nth-child(2){background:linear-gradient(145deg,#432547,#172039)}.art-card:nth-child(3){background:linear-gradient(145deg,#18494d,#172039)}.gem{position:absolute;width:62px;height:77px;right:18px;top:20px;clip-path:polygon(50% 0,93% 35%,73% 100%,25% 100%,6% 35%);background:linear-gradient(135deg,#e7bd71,#7863a9 52%,#60d3ca);opacity:.78;filter:drop-shadow(0 0 12px #75d9d066)}.art-card b{position:relative;font:600 16px 'Playfair Display';z-index:1}.art-card small{display:block;position:relative;color:#bcc6db;font-size:10px;margin-top:5px;z-index:1}.panel{background:var(--panel);border:1px solid #263353;border-radius:15px;padding:21px;margin-top:20px}.row{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:1px solid #202a45;color:#c2cae0;font-size:13px}.row:last-child{border:0}.row small{color:#72809f}.row b{color:var(--gold);font-weight:600}.notice{background:#152b35;border:1px solid #29535c;padding:16px;border-radius:12px;color:#bde4de;font-size:12px;line-height:1.5;margin-top:18px}.notice b{display:block;color:var(--cyan);margin-bottom:5px}.big-balance{background:linear-gradient(130deg,#18294b,#211933);border:1px solid #435071;padding:30px;border-radius:19px;margin-top:28px}.big-balance small{color:var(--muted);letter-spacing:1px}.big-balance strong{font:600 48px 'Playfair Display';display:block;color:var(--gold);margin:8px 0}.mining{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.mine-art{height:260px;border-radius:18px;background:radial-gradient(circle at 50% 52%,#6ddfd044,transparent 15%),linear-gradient(145deg,#122b3d,#1a1432);border:1px solid #315b6a;display:grid;place-items:center;position:relative;overflow:hidden}.mine-art:before{content:'';width:145px;height:145px;border:1px solid #d8b867aa;transform:rotate(45deg);box-shadow:0 0 45px #62d9d044,inset 0 0 30px #a67ed055}.mine-art:after{content:'◇';position:absolute;font-size:90px;color:#d5bd72;opacity:.7}.mine-info{padding:8px 4px}.mine-info h2{font:600 30px 'Playfair Display';margin:10px 0}.progress{height:7px;background:#222d49;border-radius:99px;margin:20px 0}.progress i{display:block;width:34%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:99px}.screen-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:28px}.screen-grid .card h3{font:600 20px 'Playfair Display';margin:0 0 9px}.muted{color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:760px){.stage{padding:0}.device{display:block;border-radius:0;min-height:100vh}.sidebar{position:fixed;z-index:5;left:-260px;top:0;height:100vh;width:250px;transition:.25s}.sidebar.open{left:0}.content{padding:24px 18px 90px}.top{margin-bottom:28px}.hero{grid-template-columns:1fr;min-height:350px}.hero-art{width:100%;height:155px;top:auto;bottom:0;opacity:.8}.hero-copy{padding:25px}.hero h2{font-size:30px}.dash,.cards,.mining,.screen-grid{grid-template-columns:1fr 1fr}.dash .stat:last-child{display:none}.cards .art-card{height:105px}.mobile-menu{display:block!important}.top .iconbtn{display:none}}.mobile-menu{display:none;background:#101a31;border:1px solid #2a385a;width:38px;height:38px;border-radius:10px;margin-right:10px}.mobile-menu+*{display:flex;align-items:center}
</style></head><body><div class="stage"><div class="device"><aside class="sidebar" id="sidebar"><div class="brand"><div class="sigil">✦</div><div><strong>AUREXA</strong><small>MINA · JUEGA · GANA</small></div></div><div class="navlabel">ESPACIO AUREXA</div><nav class="nav" id="nav"></nav><div class="footer">Interfaz conceptual independiente<br>Datos reales: 0 · — · servidor</div></aside><main class="content"><div class="top"><div style="display:flex;align-items:center"><button class="mobile-menu" id="menu">☰</button><span class="crumb" id="crumb">Inicio / Resumen</span></div><div class="top-actions"><button class="iconbtn" data-go="notifications">♢</button><button class="avatar" data-go="profile">YN · PERFIL</button></div></div><div class="view" id="view"></div></main></div></div><script>
const sections=[['home','⌂','Inicio'],['mining','◈','Mina / Minería'],['store','✦','Tienda'],['wallet','◇','Mis Diamantes'],['history','↺','Historial'],['profile','○','Perfil'],['support','?','Soporte'],['settings','⚙','Configuración'],['notifications','♢','Notificaciones']];let current='home';const nav=document.getElementById('nav');nav.innerHTML=sections.map(x=>`<button data-go="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('');
const data={home:{title:'El pulso de tu universo',lead:'Un espacio sereno para explorar, minar y seguir tu recorrido.',html:`<section class="hero"><div class="hero-copy"><div class="eyebrow">BUENAS NOCHES, YENIS</div><h2>Tu próxima faceta<br>empieza aquí.</h2><p>AUREXA reúne tu actividad, tu mina y tus diamantes en un solo lugar. Los datos de cuenta se leen del servidor.</p><button class="goldbtn" data-go="mining">ENTRAR EN LA MINA  →</button></div><div class="hero-art"><div class="orbit"></div><div class="orb"></div></div></section><div class="dash"><div class="stat"><small>DIAMANTES</small><strong>0 ◇</strong><em>saldo servidor</em></div><div class="stat"><small>ENERGÍA</small><strong>—</strong><em>por sincronizar</em></div><div class="stat"><small>ESTADO</small><strong>Activo</strong><em>cuenta conectada</em></div></div><div class="section-title"><h3>Rutas de hoy</h3><span>VER TODO</span></div><div class="cards"><div class="art-card" data-go="mining"><div class="gem"></div><b>Minería</b><small>Descubre tu veta</small></div><div class="art-card" data-go="store"><div class="gem"></div><b>Tienda</b><small>Catálogo oficial</small></div><div class="art-card" data-go="wallet"><div class="gem"></div><b>Wallet</b><small>Tu cámara segura</small></div></div>`},mining:{title:'Mina de cristal',lead:'La recompensa y la duración se determinan en servidor.',html:`<div class="mining"><div class="mine-art"></div><div class="mine-info"><div class="eyebrow">SESIÓN DE MINERÍA</div><h2>Una veta en calma.</h2><p class="muted">Inicia una sesión cuando esté habilitada. No se muestran recompensas simuladas.</p><div class="progress"><i></i></div><div class="row"><span>Estado</span><b>Disponible</b></div><div class="row"><span>Recompensa</span><b>—</b></div><button class="goldbtn" id="mine">INICIAR CUANDO ESTÉ DISPONIBLE</button></div></div><div class="notice"><b>Lectura segura</b> La minería real consulta <code>/api/v2/me</code>; esta vista no inventa cantidades.</div>`},store:{title:'Tienda',lead:'Catálogo oficial de diamantes, pendiente de lectura del servidor.',html:`<div class="screen-grid"><div class="card"><div class="eyebrow">CATÁLOGO</div><h3>Paquetes</h3><p class="muted">Los paquetes y precios aparecerán aquí cuando <code>/api/v2/catalog</code> entregue datos.</p><div class="art-card" style="margin-top:20px"><div class="gem"></div><b>—</b><small>sin catálogo cargado</small></div></div><div class="card"><div class="eyebrow">PROCESO OFICIAL</div><h3>Compra segura</h3><p class="muted">Revisa el catálogo publicado y continúa por el flujo autorizado de AUREXA.</p><div class="notice">No hay valores monetarios simulados en esta interfaz.</div></div></div>`},wallet:{title:'Mis diamantes',lead:'Tu cámara personal, con saldo calculado por el servidor.',html:`<div class="big-balance"><small>DIAMANTES DISPONIBLES</small><strong>0 ◇</strong><span class="muted">Saldo virtual · origen no asignado</span></div><div class="panel"><div class="row"><span>Comprados</span><b>—</b></div><div class="row"><span>Minados</span><b>—</b></div><div class="row"><span>Promocionales</span><b>—</b></div><div class="row"><span>Reservados</span><b>—</b></div></div><div class="notice"><b>Economía virtual</b> El saldo se mantiene dentro de AUREXA y no tiene valor monetario declarado.</div>`},history:{title:'Historial',lead:'Movimientos y solicitudes registrados por el servidor.',html:`<div class="panel"><div class="row"><span>Actividad reciente</span><small>estado</small></div><div class="row"><span>No hay movimientos para mostrar</span><b>—</b></div></div><div class="panel"><div class="row"><span>Compras</span><small>servidor</small></div><div class="row"><span>No hay compras para mostrar</span><b>—</b></div></div>`},profile:{title:'Perfil',lead:'Tu identidad dentro del espacio AUREXA.',html:`<div class="screen-grid"><div class="card" style="text-align:center;padding:30px"><div class="sigil" style="margin:auto;width:64px;height:64px;font-size:30px">✦</div><h3 style="margin-top:18px">Yenis Nunez</h3><p class="muted">Cuenta conectada · nivel —</p></div><div class="card"><div class="row"><span>Correo</span><b>verificado</b></div><div class="row"><span>Progreso</span><b>—</b></div><div class="row"><span>Diamantes</span><b>0 ◇</b></div></div></div>`},support:{title:'Soporte',lead:'Ayuda oficial para tu cuenta y tus operaciones.',html:`<div class="screen-grid"><div class="card"><div class="eyebrow">CANAL OFICIAL</div><h3>Estamos contigo</h3><p class="muted">Consulta dudas sobre minería, diamantes, compras, retiros, membresías y trading por el canal de soporte configurado.</p><button class="goldbtn">ABRIR SOPORTE</button></div><div class="card"><div class="eyebrow">SEGURIDAD</div><h3>Protege tu acceso</h3><p class="muted">Nunca compartas contraseñas ni códigos de verificación. AUREXA no solicita secretos por mensajes.</p></div></div>`},settings:{title:'Configuración',lead:'Preferencias y seguridad de tu cuenta.',html:`<div class="panel"><div class="row"><span>Autenticación</span><b>Firebase</b></div><div class="row"><span>Economía</span><b>Virtual</b></div><div class="row"><span>Notificaciones</span><b>Activadas</b></div><div class="row"><span>Sesión</span><b style="color:var(--cyan)">Protegida</b></div></div>`},notifications:{title:'Notificaciones',lead:'Actividad reciente registrada en tu cuenta.',html:`<div class="panel"><div class="row"><span>Sin novedades todavía</span><b>—</b></div><p class="muted" style="margin:18px 0 0">Cuando existan movimientos o avisos del servidor, aparecerán aquí.</p></div>`}};
function render(id){current=id;const s=data[id]||data.home;document.getElementById('crumb').textContent='AUREXA / '+s.title;document.getElementById('view').innerHTML=`<h1>${s.title}</h1><p class="lead">${s.lead}</p>${s.html}`;document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>render(x.dataset.go));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));document.getElementById('sidebar').classList.remove('open');}
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');render('home');
</script></body></html>
