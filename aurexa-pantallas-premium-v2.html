<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREXA — Propuesta visual nueva</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#050607;--ink:#0c0e12;--panel:#13171d;--panel2:#1b222b;--champ:#e8c985;--champ2:#fff1bf;--ice:#a8f1ff;--violet:#a88cff;--muted:#a7a5a0;--red:#c75567}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#202631,#050607 55%);color:#f8efd9;font-family:Inter,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:32px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.intro h1{margin:0;font:900 38px Cinzel,serif;letter-spacing:.14em;color:var(--champ2)}.intro p{color:#b9b6b0;margin:8px 0 0}.tag{border:1px solid #e8c98599;background:#ffffff08;padding:11px 15px;color:var(--champ2);font:700 10px Cinzel;letter-spacing:.16em}.screens{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.phone{min-height:700px;position:relative;overflow:hidden;background:linear-gradient(145deg,#202831,#0a0c10 54%,#13101c);border:1px solid #e8c98566;border-radius:18px;box-shadow:0 20px 65px #000d,0 0 0 5px #080a0c,0 0 40px #a88cff17}.phone:after{content:'';position:absolute;inset:10px;border:1px solid #ffffff12;pointer-events:none;border-radius:12px}.top{height:82px;padding:21px;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff15;background:#0c1015cc}.brand{font:900 15px Cinzel;color:var(--champ2);letter-spacing:.17em}.top small{font-size:8px;color:#9fabb2;letter-spacing:.2em;display:block;margin-top:6px}.top b{color:var(--ice);font-size:19px}.body{padding:21px 20px 64px}.eyebrow{font:700 9px Cinzel;letter-spacing:.22em;color:var(--ice)}h2{font:900 25px Cinzel;margin:10px 0;color:#fff4db}h3{font:700 13px Cinzel;color:var(--champ2);margin:0 0 8px}p{font-size:11px;line-height:1.6;color:var(--muted);margin:6px 0}.plaque{margin:19px 0;padding:18px;background:linear-gradient(135deg,#252d35,#11151b);border:1px solid #e8c98599;box-shadow:inset 0 0 0 1px #ffffff0b,0 12px 30px #0007;position:relative}.plaque:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--ice),var(--violet))}.plaque span{font-size:9px;color:#bfc6c9;letter-spacing:.18em}.plaque strong{display:block;font:900 32px Georgia;color:var(--ice);margin-top:7px;text-shadow:0 0 18px #7de5ff66}.plaque small{font-size:10px;color:#ada8a1}.button{width:100%;margin-top:12px;padding:13px;border:1px solid #f0d28c;background:linear-gradient(130deg,#b28238,#f7dfa1 48%,#9a6c2c);color:#17130d;font:900 10px Cinzel;letter-spacing:.14em;box-shadow:0 8px 22px #0007}.button.dark{background:#11161c;color:var(--champ2);border-color:#e8c98566}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.mini{padding:15px;border:1px solid #ffffff18;background:#ffffff08}.mini b{display:block;font:900 23px Georgia;color:var(--champ2)}.mini small{font-size:9px;color:#a9adb1}.crystal{height:172px;display:grid;place-items:center;position:relative;margin:4px 0 15px}.crystal:before{content:'';position:absolute;width:150px;height:150px;border:1px solid #e8c98566;border-radius:50%;box-shadow:0 0 35px #a88cff40;transform:rotate(28deg)}.crystal:after{content:'';position:absolute;width:180px;height:62px;border:1px solid #a8f1ff66;border-radius:50%;transform:rotate(-20deg)}.crystal b{font-size:94px;color:#e8fdff;text-shadow:0 0 20px white,0 0 45px #7de5ff,0 0 82px #a88cff;z-index:1}.list{border-top:1px solid #ffffff18}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ffffff13;font-size:10px}.row span{color:#d0cbc2}.row b{color:var(--champ2)}.note{padding:13px;background:#161323;border-left:3px solid var(--violet);font-size:10px;color:#cfc4df;margin-top:15px}.portrait{height:170px;margin:-21px -20px 18px;background:radial-gradient(circle at 50% 32%,#fff0c944,transparent 15%),linear-gradient(145deg,#35303b,#0d1118);display:grid;place-items:center;border-bottom:1px solid #e8c98566}.portrait b{font-size:82px;color:#e8d9ff;text-shadow:0 0 35px #a88cff}.nav{position:absolute;left:0;right:0;bottom:0;height:58px;display:grid;grid-template-columns:repeat(5,1fr);background:#090c10f2;border-top:1px solid #e8c98544}.nav div{text-align:center;padding-top:10px;color:#899197;font-size:8px}.nav b{display:block;color:var(--champ);font-size:16px;margin-bottom:3px}.nav .on,.nav .on b{color:var(--ice)}.creator{grid-column:span 2;min-height:440px}.creator .body{display:grid;grid-template-columns:1fr 1fr;gap:12px}.creator .plaque{margin:0}.creator .list{grid-column:1/-1}.creator:before{content:'ACCESO CREADORA';position:absolute;z-index:2;right:16px;top:20px;color:var(--red);font:700 8px Cinzel;letter-spacing:.13em}@media(max-width:1100px){.screens{grid-template-columns:repeat(3,1fr)}.creator{grid-column:span 1}}@media(max-width:760px){.wrap{padding:18px}.intro{display:block}.tag{display:inline-block;margin-top:14px}.screens{grid-template-columns:1fr}.phone{min-height:690px}.creator{grid-column:span 1}}</style></head><body><div class="wrap"><header class="intro"><div><h1>AUREXA</h1><p>Propuesta premium v2 · obsidiana, champán y cristal</p></div><div class="tag">DISEÑO PREMIUM V2</div></header><main class="screens" id="screens"></main></div><script>

['Inicio','Centro de operaciones',`<div class="eyebrow">✦ REINO DE DIAMANTES ✦</div><h2>Tu progreso<br>en AUREXA</h2><p>Una pantalla de control clara, elegante y mágica.</p><div class="plaque"><span>DIAMANTES DISPONIBLES</span><strong>◇ 1,280</strong><small>saldo virtual</small></div><div class="grid2"><div class="mini"><b>⚒</b><small>Minería activa</small></div><div class="mini"><b>◈</b><small>Comprar</small></div></div><button class="button">ABRIR MINERÍA</button><button class="button dark">VER WALLET</button>`],

['Comprar','Paquetes oficiales',`<div class="eyebrow">MERCADO AUREXA</div><h2>Comprar diamantes</h2><p>Paquetes cargados desde el catálogo real.</p><div class="plaque"><span>PAQUETE PREMIUM</span><strong style="font-size:25px">◇ 250</strong><small>5,000 CUP · 7 días de minería</small><button class="button">SOLICITAR PAQUETE</button></div><div class="list"><div class="row"><span>Starter · 20 ◆</span><b>500 CUP</b></div><div class="row"><span>Basic · 50 ◆</span><b>1,000 CUP</b></div><div class="row"><span>Pro · 120 ◆</span><b>2,500 CUP</b></div></div>`],

['Perfil','Cuenta AUREXA',`<div class="portrait"><b>♙</b></div><div class="eyebrow">IDENTIDAD DE CUENTA</div><h2>Perfil</h2><p>Tu información y progreso dentro de AUREXA.</p><div class="grid2"><div class="mini"><b>◇</b><small>Diamantes</small></div><div class="mini"><b>—</b><small>Plan actual</small></div></div><button class="button dark">SEGURIDAD DE CUENTA</button>`],
['Soporte','Guía y atención',`<div class="eyebrow">AYUDA OFICIAL</div><h2>Soporte</h2><p>Orientación sobre minería, compras, diamantes, retiros y membresías.</p><button class="button">CONTACTAR SOPORTE</button><div class="list"><div class="row"><span>Minería</span><b>Guía</b></div><div class="row"><span>Wallet y retiros</span><b>Guía</b></div><div class="row"><span>Compras</span><b>Ayuda</b></div></div>`],
['Configuración','Cuenta y seguridad',`<div class="eyebrow">CUENTA</div><h2>Configuración</h2><div class="list"><div class="row"><span>Correo verificado</span><b>Sí</b></div><div class="row"><span>Autenticación</span><b>Firebase</b></div><div class="row"><span>Economía</span><b>Virtual</b></div><div class="row"><span>Notificaciones</span><b>Preferencias</b></div></div><button class="button dark">CERRAR SESIÓN</button>`],
['Creadora','Centro administrativo',`<div class="eyebrow">♜ SALA DE CONTROL</div><h2>Panel de creadora</h2><p>Operaciones administrativas separadas de la cuenta del usuario.</p><div class="grid2"><div class="mini"><b>03</b><small>Compras pendientes</small></div><div class="mini"><b>02</b><small>Retiros pendientes</small></div></div><button class="button">REVISAR COMPRAS</button><button class="button dark">REVISAR RETIROS</button>`,true]
];
function card(x,i){return `<section class="phone ${x[3]?'creator':''}"><header class="top"><div><div class="brand">♛ AUREXA</div><small>${x[0].toUpperCase()}</small></div><b>◇</b></header><div class="body">${x[2]}</div>${!x[3]?`<nav class="nav"><div class="on"><b>⌂</b>INICIO</div><div><b>⚒</b>MINAR</div><div><b>◇</b>WALLET</div><div><b>◈</b>COMPRAR</div><div><b>♙</b>PERFIL</div></nav>`:''}</section>`};document.querySelector('#screens').innerHTML=data.map(card).join('');</script></body></html>
