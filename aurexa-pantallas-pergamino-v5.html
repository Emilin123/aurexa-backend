<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREXA — Propuesta visual nueva</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--wood:#180c09;--wood2:#321713;--paper:#e7ce96;--paper2:#f8e7b7;--ink:#302016;--red:#822d35;--blue:#245b69;--gold:#b37a2d;--shadow:#090403}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#563022,#100806 62%);color:var(--ink);font-family:Inter,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:30px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px;color:#f5dfb0}.intro h1{margin:0;font:900 39px Cinzel,serif;letter-spacing:.14em}.intro p{margin:7px 0 0;color:#d7b991}.tag{padding:11px 15px;border:1px solid #e7c47799;color:#ffe4a9;font:700 10px Cinzel;letter-spacing:.13em;background:#1b0c0a}.screens{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}.phone{position:relative;min-height:710px;overflow:hidden;background:linear-gradient(135deg,#c79c5d,#f0d49d 14%,#d7b778 78%,#a87537);border:5px solid #2b120b;border-radius:4px;box-shadow:0 22px 58px #000c,0 0 0 1px #f3d48b,0 0 0 7px #6d3a1d}.phone:before{content:'❦';position:absolute;z-index:3;top:12px;right:15px;font-size:22px;color:#7d2b2d}.phone:after{content:'';position:absolute;inset:9px;border:1px solid #6b3b1a;pointer-events:none}.top{height:80px;padding:20px 19px 12px;display:flex;justify-content:space-between;background:#d8b572;border-bottom:2px solid #704019}.brand{font:900 15px Cinzel;color:#2c160c;letter-spacing:.14em}.top small{display:block;font-size:8px;color:#704019;letter-spacing:.18em;margin-top:5px}.top b{font-size:22px;color:var(--red)}.body{padding:21px 19px 68px;background:radial-gradient(circle at 50% 0,#fff0bf44,transparent 45%),linear-gradient(180deg,#e8cf9940,#cda65b20)}.eyebrow{font:700 9px Cinzel;le ['Configuración','Cuenta y seguridad',`<div class="eyebrow">CUENTA</div><h2>Configuración</h2><div class="list"><div class="row"><span>Correo verificado</span><b>Sí</b></div><div class="row"><span>Autenticación</span><b>Firebase</b></div><div class="row"><span>Economía</span><b>Virtual</b></div><div class="row"><span>Notificaciones</span><b>Preferencias</b></div></div><button class="button dark">CERRAR SESIÓN</button>`],

function card(x,i){return `<section class="phone ${x[3]?'creator':''}"><header class="top"><div><div class="brand">♛ AUREXA</div><small>${x[0].toUpperCase()}</small></div><b>◇</b></header><div class="body">${x[2]}</div>${!x[3]?`<nav class="nav"><div class="on"><b>⌂</b>INICIO</div><div><b>⚒</b>MINAR</div><div><b>◇</b>WALLET</div><div><b>◈</b>COMPRAR</div><div><b>♙</b>PERFIL</div></nav>`:''}</section>`};document.querySelector('#screens').innerHTML=data.map(card).join('');</script></body></html>
