<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREXA — Propuesta visual nueva</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--night:#0a0810;--slate:#161322;--iron:#282333;--parch:#d8c29a;--parch2:#f2dfb8;--teal:#69d8d0;--wine:#8c304d;--gold:#d6a859;--ash:#aaa3a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#31233b,#08070d 58%);color:#f6e9cf;font-family:Inter,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:30px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.intro h1{margin:0;font:900 38px Cinzel,serif;letter-spacing:.12em;color:var(--parch2)}.intro p{margin:7px 0 0;color:#bbb0b9}.tag{background:#161121;border:1px solid #d6a85988;padding:11px 14px;color:var(--parch2);font:700 10px Cinzel;letter-spacing:.15em}.screens{display:grid;grid-template-columns:repeat(4,1fr);gap:23px}.phone{position:relative;min-height:705px;overflow:hidden;background:linear-gradient(160deg,#272233,#0b0910 58%,#1b0e18);border:2px solid #44374b;border-radius:10px;box-shadow:0 20px 65px #000e,0 0 0 1px #d6a85955,0 0 45px #8c304d22}.phone:before{content:'✧';position:absolute;right:12px;top:10px;color:var(--gold);font-size:22px;z-index:2}.top{height:78px;padding:19px 18px 12px;display:flex;justify-content:space-between;background:linear-gradient(#302638,#17121e);border-bottom:2px solid #d6a85955}.brand{font:900 15px Cinzel;color:var(--parch2);letter-spacing:.13em}.top small{display:block;color:#a99bab;font-size:8px;letter-spacing:.18em;margin-top:5px}.top b{color:var(--teal);font-size:22px}.body{padding:20px 18px 67px}.eyebrow{font:700 9px Cinzel;letter-spacing:.2em;color:var(--teal)}h2{font:900 26px Cinzel;margin:10px 0 4px;color:var(--parch2)}h3{font:700 13px Cinzel;color:var(--parch2);margin:0 0 7px}p{font-size:11px;line-height:1.55;color:var(--ash);margin:6px 0}.plaque{position:relative;margin:18px 0;padding:17px;background:linear-gradient(135deg,#2d2735,#17121d);border:1px solid #d6a85999;box-shadow:inset 0 0 0 3px #0b091099,0 12px 25px #0008}.plaque:after{content:'◈';position:absolute;right:14px;top:11px;color:var(--gold);font-size:18px}.plaque span{font-size:9px;color:#c0b1ae;letter-spacing:.17em}.plaque strong{display:block;color:#baf5f0;font:900 32px Georgia;margin-top:7px;text-shadow:0 0 16px #69d8d077}.plaque small{font-size:10px;color:#b7a9b3}.button{display:block;width:100%;margin-top:12px;padding:13px;background:linear-gradient(180deg,#d7b36d,#97703b);border:1px solid #f1d69a;color:#21170e;font:900 10px Cinzel;letter-spacing:.12em;box-shadow:0 7px 18px #0008}.button.dark{background:linear-gradient(180deg,#25202d,#12101a);border-color:#d6a85977;color:var(--parch2)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{padding:14px 11px;background:#0d0b12aa;border:1px solid #d6a85944;position:relative}.mini:before{content:'✧';position:absolute;right:8px;top:5px;color:#8c304d}.mini b{display:block;color:var(--parch2);font:900 22px Georgia}.mini small{font-size:9px;color:#aaa1aa}.crystal{height:172px;display:grid;place-items:center;position:relative;margin:3px 0 12px}.crystal:before{content:'';position:absolute;width:128px;height:150px;background:linear-gradient(135deg,transparent 44%,#69d8d066 45% 55%,transparent 56%);clip-path:polygon(50% 0,100% 42%,70% 100%,27% 90%,0 42%);filter:drop-shadow(0 0 20px #69d8d0)}.crystal:after{content:'ᛉ  ᛟ  ᚱ';position:absolute;bottom:5px;color:#d6a85988;letter-spacing:10px}.crystal b{font-size:80px;color:#d8ffff;text-shadow:0 0 15px #fff,0 0 40px #69d8d0,0 0 70px #8c304d;z-index:1}.list{border-top:1px solid #d6a85944}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #d6a8592b;font-size:10px}.row span{color:#d4c5c0}.row b{color:var(--parch2)}.note{margin-top:14px;padding:13px;background:#1f1220;border:1px solid #8c304d88;color:#d9c4d0;font-size:10px}.portrait{height:174px;margin:-20px -18px 18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#d6a85955,transparent 18%),linear-gradient(150deg,#39253c,#100d15);border-bottom:2px solid #d6a85955}.portrait b{font-size:86px;color:#e9d5ff;text-shadow:0 0 30px #8c304d}.nav{position:absolute;bottom:0;left:0;right:0;height:59px;display:grid;grid-template-columns:repeat(5,1fr);background:#0c0911f4;border-top:1px solid #d6a85966}.nav div{text-align:center;padding-top:10px;color:#938894;font-size:8px}.nav b{display:block;color:var(--gold);font-size:17px;margin-bottom:3px}.nav .on,.nav .on b{color:var(--teal)}.creator{grid-column:span 2;min-height:445px}.creator .body{display:grid;grid-template-columns:1fr 1fr;gap:12px}.creator .plaque{margin:0}.creator .list{grid-column:1/-1}.creator:after{content:'✧ SALA DE LA CORONA · CREADORA';position:absolute;right:15px;top:18px;color:#d6a859;font:700 8px Cinzel;letter-spacing:.1em}@media(max-width:1100px){.screens{grid-template-columns:repeat(3,1fr)}.creator{grid-column:span 1}}@media(max-width:760px){.wrap{padding:18px}.intro{display:block}.tag{display:inline-block;margin-top:14px}.screens{grid-template-columns:1fr}.phone{min-height:690px}.creator{grid-column:span 1}}</style></head><body><div class="wrap"><header class="intro"><div><h1>AUREXA</h1><p>Propuesta gótica medieval v3 · catedral, pergamino y cristal</p></div><div class="tag">DISEÑO GÓTICO MEDIEVAL V3</div></header><main class="screens" id="screens"></main></div><script>
const data=[
['Inicio','Centro de operaciones',`<div class="eyebrow">✦ REINO DE DIAMANTES ✦</div><h2>Tu progreso<br>en AUREXA</h2><p>Una pantalla de control clara, elegante y mágica.</p><div class="plaque"><span>DIAMANTES DISPONIBLES</span><strong>◇ 1,280</strong><small>saldo virtual</small></div><div class="grid2"><div class="mini"><b>⚒</b><small>Minería activa</small></div><div class="mini"><b>◈</b><small>Comprar</small></div></div><button class="button">ABRIR MINERÍA</button><button class="button dark">VER WALLET</button>`],
['Minería','Producción de diamantes',`<div class="crystal"><b>◇</b></div><div class="eyebrow">PLAN ACTIVO</div><h2>Minería</h2><p>Registra tu actividad con las condiciones validadas por AUREXA.</p><div class="plaque"><span>ESTADO</span><strong style="font-size:22px">ACTIVA</strong><small>Plan Premium · servidor</small></div><button class="button">REGISTRAR MINERÍA</button><div class="list"><div class="row"><span>Plan</span><b>Premium</b></div><div class="row"><span>Duración</span><b>7 días</b></div><div class="row"><span>Actividad</span><b>Validada</b></div></div>`],
['Wallet','Mis diamantes',`<div class="eyebrow">BÓVEDA VIRTUAL</div><h2>Wallet</h2><div class="plaque"><span>SALDO DISPONIBLE</span><strong>◇ 1,280</strong><small>diamantes virtuales</small></div><div class="grid2"><div class="mini"><b>＋</b><small>Comprar</small></div><div class="mini"><b>↗</b><small>Retirar</small></div></div><button class="button">SOLICITAR RETIRO</button><div class="note">Los retiros requieren revisión y procesamiento manual.</div>`],
['Comprar','Paquetes oficiales',`<div class="eyebrow">MERCADO AUREXA</div><h2>Comprar diamantes</h2><p>Paquetes cargados desde el catálogo real.</p><div class="plaque"><span>PAQUETE PREMIUM</span><strong style="font-size:25px">◇ 250</strong><small>5,000 CUP · 7 días de minería</small><button class="button">SOLICITAR PAQUETE</button></div><div class="list"><div class="row"><span>Starter · 20 ◆</span><b>500 CUP</b></div><div class="row"><span>Basic · 50 ◆</span><b>1,000 CUP</b></div><div class="row"><span>Pro · 120 ◆</span><b>2,500 CUP</b></div></div>`],
['Historial','Actividad registrada',`<div class="eyebrow">LIBRO DE MOVIMIENTOS</div><h2>Historial</h2><div class="list"><div class="row"><span>Recompensa de minería</span><b>+50 ◆</b></div><div class="row"><span>Compra de paquete</span><b>+250 ◆</b></div><div class="row"><span>Solicitud de retiro</span><b>En revisión</b></div><div class="row"><span>Referencia de operación</span><b>Registrada</b></div></div><div class="note">Cada movimiento debe provenir del servidor y conservar su estado.</div>`],
['Perfil','Cuenta AUREXA',`<div class="portrait"><b>♙</b></div><div class="eyebrow">IDENTIDAD DE CUENTA</div><h2>Perfil</h2><p>Tu información y progreso dentro de AUREXA.</p><div class="grid2"><div class="mini"><b>◇</b><small>Diamantes</small></div><div class="mini"><b>—</b><small>Plan actual</small></div></div><button class="button dark">SEGURIDAD DE CUENTA</button>`],
['Soporte','Guía y atención',`<div class="eyebrow">AYUDA OFICIAL</div><h2>Soporte</h2><p>Orientación sobre minería, compras, diamantes, retiros y membresías.</p><button class="button">CONTACTAR SOPORTE</button><div class="list"><div class="row"><span>Minería</span><b>Guía</b></div><div class="row"><span>Wallet y retiros</span><b>Guía</b></div><div class="row"><span>Compras</span><b>Ayuda</b></div></div>`],
['Configuración','Cuenta y seguridad',`<div class="eyebrow">CUENTA</div><h2>Configuración</h2><div class="list"><div class="row"><span>Correo verificado</span><b>Sí</b></div><div class="row"><span>Autenticación</span><b>Firebase</b></div><div class="row"><span>Economía</span><b>Virtual</b></div><div class="row"><span>Notificaciones</span><b>Preferencias</b></div></div><button class="button dark">CERRAR SESIÓN</button>`],
['Creadora','Centro administrativo',`<div class="eyebrow">♜ SALA DE CONTROL</div><h2>Panel de creadora</h2><p>Operaciones administrativas separadas de la cuenta del usuario.</p><div class="grid2"><div class="mini"><b>03</b><small>Compras pendientes</small></div><div class="mini"><b>02</b><small>Retiros pendientes</small></div></div><button class="button">REVISAR COMPRAS</button><button class="button dark">REVISAR RETIROS</button>`,true]
];
function card(x,i){return `<section class="phone ${x[3]?'creator':''}"><header class="top"><div><div class="brand">♛ AUREXA</div><small>${x[0].toUpperCase()}</small></div><b>◇</b></header><div class="body">${x[2]}</div>${!x[3]?`<nav class="nav"><div class="on"><b>⌂</b>INICIO</div><div><b>⚒</b>MINAR</div><div><b>◇</b>WALLET</div><div><b>◈</b>COMPRAR</div><div><b>♙</b>PERFIL</div></nav>`:''}</section>`};document.querySelector('#screens').innerHTML=data.map(card).join('');</script></body></html>
