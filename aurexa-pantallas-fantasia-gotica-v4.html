<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREXA — Propuesta visual nueva</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--void:#05030b;--amethyst:#17102a;--plum:#2b1239;--gold:#e4b85e;--gold2:#ffe7a8;--ice:#89efff;--ruby:#ef4967;--mist:#c0a9cc;--line:#e4b85e66}*{box-sizing:border-box}body{margin:0;background:#04030a;color:#f9eed8;font-family:Inter,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:30px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.intro h1{margin:0;font:900 38px Cinzel,serif;letter-spacing:.16em;color:var(--gold2);text-shadow:0 0 25px #e4b85e33}.intro p{margin:7px 0 0;color:#bdaac2}.tag{padding:11px 14px;border:1px solid var(--line);background:#10091b;color:var(--gold2);font:700 10px Cinzel;letter-spacing:.15em}.screens{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.phone{position:relative;overflow:hidden;min-height:710px;background:linear-gradient(145deg,#221337,#080610 60%,#120a22);border:1px solid var(--line);box-shadow:0 24px 65px #000e,0 0 32px #8d40ad29;border-radius:5px}.phone:before{content:'♢';position:absolute;z-index:2;right:14px;top:10px;color:var(--ice);font-size:18px;text-shadow:0 0 15px var(--ice)}.phone:after{content:'';position:absolute;inset:8px;border:1px solid #ffffff12;pointer-events:none}.top{height:78px;padding:19px 18px 12px;display:flex;justify-content:space-between;background:linear-gradient(90deg,#180d28,#0a0812);border-bottom:1px solid var(--line)}.brand{font:900 15px Cinzel;color:var(--gold2);letter-spacing:.16em}.top small{display:block;color:#a991b4;font-size:8px;letter-spacing:.19em;margin-top:5px}.top b{font-size:22px;color:var(--ice)}.body{padding:21px 19px 67px}.eyebrow{font:700 9px Cinzel;letter-spacing:.2em;color:var(--ice)}h2{font:900 26px Cinzel;margin:10px 0 4px;color:#fff0cf;text-shadow:0 3px 16px #000}h3{font:700 13px Cinzel;color:var(--gold2);margin:0 0 7px}p{font-size:11px;line-height:1.6;color:#b7a7ba;margin:6px 0}.plaque{position:relative;margin:19px 0;padding:18px;background:linear-gradient(135deg,#321442,#11091c);border:1px solid var(--line);box-shadow:inset 0 0 25px #a83dc833,0 12px 28px #0009;clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px))}.plaque:after{content:'✦';position:absolute;right:13px;top:10px;color:var(--ruby);text-shadow:0 0 12px var(--ruby)}.plaque span{font-size:9px;color:#c7b3cb;letter-spacing:.18em}.plaque strong{display:block;font:900 33px Georgia;color:var(--ice);text-shadow:0 0 20px #5de6ff;margin-top:7px}.plaque small{font-size:10px;color:#c4aec9}.button{display:block;width:100%;padding:14px;margin-top:12px;border:1px solid #ffe3a0;background:linear-gradient(135deg,#8a4f18,#ffe39d 48%,#8a4f18);color:#180d0b;font:900 10px Cinzel;letter-spacing:.14em;box-shadow:0 8px 21px #0008}.button.dark{background:#130c20;color:var(--gold2);border-color:var(--line)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{position:relative;padding:15px 12px;border:1px solid #ffffff18;background:linear-gradient(140deg,#1d1230,#0b0812)}.mini:before{content:'✦';position:absolute;right:8px;top:5px;color:var(--ruby)}.mini b{display:block;font:900 24px Georgia;color:var(--gold2)}.mini small{font-size:9px;color:#afa2b5}.crystal{height:178px;display:grid;place-items:center;position:relative}.crystal:before{content:'';position:absolute;width:145px;height:145px;border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 30px #8d40ad66;transform:rotate(45deg)}.crystal:after{content:'ᛉ ᛟ ᚱ';position:absolute;bottom:5px;letter-spacing:11px;color:#8d40ad;font-size:12px}.crystal b{font-size:94px;color:#e9ffff;text-shadow:0 0 15px #fff,0 0 40px var(--ice),0 0 85px var(--violet);z-index:1}.list{border-top:1px solid #ffffff16}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ffffff12;font-size:10px}.row span{color:#d4c4d6}.row b{color:var(--gold2)}.note{margin-top:15px;padding:13px;background:#1d0d2d;border-left:3px solid var(--ruby);color:#d5bed6;font-size:10px}.portrait{height:175px;margin:-21px -19px 18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 33%,#89efff55,transparent 17%),linear-gradient(145deg,#38205b,#0b0712);border-bottom:1px solid var(--line)}.portrait b{font-size:88px;color:#e4d6ff;text-shadow:0 0 30px #a66dff}.nav{position:absolute;bottom:0;left:0;right:0;height:59px;display:grid;grid-template-columns:repeat(5,1fr);background:#09050ef5;border-top:1px solid var(--line)}.nav div{text-align:center;padding-top:10px;color:#92819d;font-size:8px}.nav b{display:block;color:var(--gold);font-size:17px;margin-bottom:3px}.nav .on,.nav .on b{color:var(--ice);text-shadow:0 0 12px var(--ice)}.creator{grid-column:span 2;min-height:450px}.creator .body{display:grid;grid-template-columns:1fr 1fr;gap:12px}.creator .plaque{margin:0}.creator .list{grid-column:1/-1}.creator:after{content:'✦ CÍRCULO DE LA CREADORA';position:absolute;top:17px;right:16px;color:var(--ruby);font:700 8px Cinzel;letter-spacing:.1em}@media(max-width:1100px){.screens{grid-template-columns:repeat(3,1fr)}.creator{grid-column:span 1}}@media(max-width:760px){.wrap{padding:18px}.intro{display:block}.tag{display:inline-block;margin-top:14px}.screens{grid-template-columns:1fr}.phone{min-height:695px}.creator{grid-column:span 1}}</style></head><body><div class="wrap"><header class="intro"><div><h1>AUREXA</h1><p>Propuesta gótica de alta fantasía v4 · círculo de cristal y rubí</p></div><div class="tag">DISEÑO FANTASÍA GÓTICA V4</div></header><main class="screens" id="screens"></main></div><script>
const data=[
['Inicio','Centro de operaciones',`<div class="eyebrow">✦ REINO DE DIAMANTES ✦</div><h2>Tu progreso<br>en AUREXA</h2><p>Una pantalla de control clara, elegante y mágica.</p><div class="plaque"><span>DIAMANTES DISPONIBLES</span><strong>◇ 1,280</strong><small>saldo virtual</small></div><div class="grid2"><div class="mini"><b>⚒</b><small>Minería activa</small></div><div class="mini"><b>◈</b><small>Comprar</small></div></div><button class="button">ABRIR MINERÍA</button><button class="button dark">VER WALLET</button>`],
['Minería','Producción de diamantes',`<div class="crystal"><b>◇</b></div><div class="eyebrow">PLAN ACTIVO</div><h2>Minería</h2><p>Registra tu actividad con las condiciones validadas por AUREXA.</p><div class="plaque"><span>ESTADO</span><strong style="font-size:22px">ACTIVA</strong><small>Plan Premium · servidor</small></div><button class="button">REGISTRAR MINERÍA</button><div class="list"><div class="row"><span>Plan</span><b>Premium</b></div><div class="row"><span>Duración</span><b>7 días</b></div><div class="row"><span>Actividad</span><b>Validada</b></div></div>`],
['Wallet','Mis diamantes',`<div class="eyebrow">BÓVEDA VIRTUAL</div><h2>Wallet</h2><div class="plaque"><span>SALDO DISPONIBLE</span><strong>◇ 1,280</strong><small>diamantes virtuales</small></div><div class="grid2"><div class="mini"><b>＋</b><small>Comprar</small></div><div class="mini"><b>↗</b><small>Retirar</small></div></div><button class="button">SOLICITAR RETIRO</button><div class="note">Los retiros requieren revisión y procesamiento manual.</div>`],
['Comprar','Paquetes oficiales',`<div class="eyebrow">MERCADO AUREXA</div><h2>Comprar diamantes</h2><p>Paquetes cargados desde el catálogo real.</p><div class="plaque"><span>PAQUETE PREMIUM</span><strong style="font-size:25px">◇ 250</strong><small>5,000 CUP · 7 días de minería</small><button class="button">SOLICITAR PAQUETE</button></div><div class="list"><div class="row"><span>Starter · 20 ◆</span><b>500 CUP</b></div><div class="row"><span>Basic · 50 ◆</span><b>1,000 CUP</b></div><div class="row"><span>Pro · 120 ◆</span><b>2,500 CUP</b></div></div>`],
['Historial','Actividad registrada',`<div class="eyebrow">LIBRO DE MOVIMIENTOS</div><h2>Historial</h2><div class="list"><div class="row"><span>Recompensa de minería</span><b>+50 ◆</b></div><div class="row"><span>Compra de paquete</span><b>+250 ◆</b></div><div class="row"><span>Solicitud de retiro</span><b>En revisión</b></div><div class="row"><span>Referencia de operación</span><b>Registrada</b></div></div><div class="note">Cada movimiento debe provenir del servidor y conservar su estado.</div>`],
['Perfil','Cuenta AUREXA',`<div class="portrait"><b>♙</b></div><div class="eyebrow">IDENTIDAD DE CUENTA</div><h2>Perfil</h2><p>Tu información y progreso dentro de AUREXA.</p><div class="grid2"><div class="mini"><b>◇</b><small>Diamantes</small></div><div class="mini"><b>—</b><small>Plan actual</small></div></div><button class="button dark">SEGURIDAD DE CUENTA</button>`],
['Soporte','Guía y atención',`<div class="eyebrow">AYUDA OFICIAL</div><h2>Soporte</h2><p>Orientación sobre minería, compras, diamantes, retiros y membresías.</p><button class="button">CONTACTAR SOPORTE</button><div class="list"><div class="row"><span>Minería</span><b>Guía</b></div><div class="row"><span>Wallet y retiros</span><b>Guía</b></div><div class="row"><span>Compras</span><b>Ayuda</b></div></div>`],
['Configuración','Cuenta y seguridad',`<div class="eyebrow">CUENTA</div><h2>Configuración</h2><div class="list"><div class="row"><span>Correo verificado</span><b>Sí</b></div><div class="row"><span>Autenticación</span><b>Firebase</b></div><div class="row"><span>Economía</span><b>Virtual</b></div><div class="row"><span>Notificaciones</span><b>Preferencias</b></div></div><button class="button dark">CERRAR SESIÓN</button>`],
['Creadora','Centro administrativo',`<div class="eyebrow">♜ SALA DE CONTROL</div><h2>Panel de creadora</h2><p>Operaciones administrativas separadas de la cuenta del usuario.</p><div class="grid2"><div class="mini"><b>03</b><small>Compras pendientes</small></div><div class="mini"><b>02</b><small>Retiros pendientes</small></div></div><button class="button">REVISAR COMPRAS</button><button class="button dark">REVISAR RETIROS</button>`,true]
];
function card(x,i){return `<section class="phone ${x[3]?'creator':''}"><header class="top"><div><div class="brand">♛ AUREXA</div><small>${x[0].toUpperCase()}</small></div><b>◇</b></header><div class="body">${x[2]}</div>${!x[3]?`<nav class="nav"><div class="on"><b>⌂</b>INICIO</div><div><b>⚒</b>MINAR</div><div><b>◇</b>WALLET</div><div><b>◈</b>COMPRAR</div><div><b>♙</b>PERFIL</div></nav>`:''}</section>`};document.querySelector('#screens').innerHTML=data.map(card).join('');</script></body></html>
