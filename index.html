<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#0a0a0a"/><meta name="description" content="AUREXA — minería de diamantes virtuales."/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>AUREXA — Beta pública</title><link rel="stylesheet" href="/app.css?v=fe0dea02"/><style>html,body{background:#0a0a0a;color:#fff}#boot{min-height:100vh;display:grid;place-items:center;background:#0a0a0a;font-family:system-ui,sans-serif}#bootBox{width:min(420px,88vw);padding:28px;border:1px solid #333;border-radius:20px;text-align:center;background:#111}#bootBox h1{color:#ffd700;margin:0 0 10px}#bootMsg{color:#aaa;font-size:14px;line-height:1.5}.bootErr{color:#ff7777!important;text-align:left;white-space:pre-wrap;word-break:break-word;font-size:12px!important}</style></head><body><div id="root"><div id="boot"><div id="bootBox"><h1>◆ AUREXA</h1><div id="bootMsg">Cargando autenticación segura…</div></div></div></div><script>window.addEventListener('error',function(e){var m=document.getElementById('bootMsg');if(m){m.className='bootErr';m.textContent='Error al cargar AUREXA: '+(e.message||'Error JavaScript')+'\n\nArchivo: '+(e.filename||'desconocido')+'\nLínea: '+(e.lineno||'?')}});window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('bootMsg');if(m){m.className='bootErr';m.textContent='Error de autenticación: '+(e.reason?.message||e.reason||'Promesa rechazada')}});setTimeout(function(){var m=document.getElementById('bootMsg');if(m&&m.textContent==='Cargando autenticación segura…'){m.className='bootErr';m.textContent='AUREXA no terminó de cargar. El problema está en el módulo de autenticación o en la carga de Firebase, no en tu contraseña.'}},12000);</script><script type="module" src="/app-safe.js?v=3"></script></body></htm
