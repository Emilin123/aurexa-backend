<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#070609"/><meta name="description" content="AUREXA — minería de diamantes virtuales."/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>AUREXA — Reino de Diamantes</title><link rel="stylesheet" href="/app.css?v=0a743a21"/><link rel="stylesheet" href="/gothic.css?v=2620261e"/><style>html,body{background:#070609;color:#fff}#boot{min-height:100vh;display:grid;place-items:center;background:#070609;font-family:system-ui,sans-serif}#bootBox{width:min(420px,88vw);padding:28px;border:1px solid #d6a63a55;text-align:center;background:#120b10}#bootBox h1{color:#ffe5a6;margin:0 0 10px;font-family:Georgia,serif}#bootMsg{color:#aaa;font-size:14px;line-height:1.5}.bootErr{color:#ff7777!important;text-align:left;white-space:pre-wrap;word-break:break-word;font-size:12px!important}</style></head><body><div id="root"><div id="boot"><div id="bootBox"><h1>◆ AUREXA</h1><div id="bootMsg">Invocando el reino…</div></div></div></div><script>window.addEventListener('error',function(e){var m=document.getElementById('bootMsg');if(m){m.className='bootErr';m.textContent='Error al cargar AUREXA: '+(e.message||'Error JavaScript')+'\n\nArchivo: '+(e.filename||'desconocido')+'\nLínea: '+(e.lineno||'?')}});window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('bootMsg');if(m){m.className='bootErr';m.textContent='Error de autenticación: '+(e.reason?.message||e.reason||'Promesa rechazada')}});</script><script type="module" src="/app-safe.js?v=4"></script></body></html>
