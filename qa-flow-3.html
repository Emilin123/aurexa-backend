<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREXA · Flujo de revisión 3 pantallas</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050b;color:#fff;font:14px Arial}#app{min-height:100vh;display:grid;place-items:center}.canvas{position:relative;width:min(576px,100vw);aspect-ratio:576/1024;background:#02050b center/contain no-repeat}.hot{position:absolute;background:transparent;border:0;cursor:pointer}.hot:focus-visible{outline:3px solid #5de7ff}.splash{background-image:url('/1788823016722-99749f05.jpg')}.login{background-image:url('/1788823016733-9ded0bd9.jpg')}.signup{background-image:url('/1788823070568-5143584f.jpg')}.splash .next{left:8%;right:8%;top:72%;height:22%}.login .enter{left:15%;right:15%;top:59%;height:13%}.login .signup-link{left:8%;right:8%;top:34%;height:12%}.signup .create{left:12%;right:12%;top:69%;height:15%}.signup .back{left:5%;width:35%;top:25%;height:12%}.sr{position:absolute;left:-9999px}</style></head><body><main id=app aria-live=polite></main><script>const app=document.querySelector('#app');function show(k){app.innerHTML='';const c=document.createElement('section');c.className='canvas '+k; if(k==='splash'){c.innerHTML='<button class="hot next" aria-label="Continuar" onclick="show(\'login\')"></button>'}if(k==='login'){c.innerHTML='<button class="hot enter" aria-label="Entrar" onclick="alert(\'Botón Entrar conectado para revisión\')"></button><button class="hot signup-link" aria-label="Crear cuenta" onclick="show(\'signup\')"></button>'}if(k==='signup'){c.innerHTML='<button class="hot create" aria-label="Crear cuenta" onclick="alert(\'Botón Crear cuenta conectado para revisión\')"></button><button class="hot back" aria-label="Volver a Login" onclick="show(\'login\')"></button>'}app.append(c)}show('splash')</script></body></html>
