name: Prepare backend lockfile
on:
  push:
    branches: [beta/antifraud-staging-20260910]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate v3 lockfile only when absent
        shell: bash
        run: |
          if test ! -f package-lock.json; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          node -e "const fs=require('fs'); if(!fs.existsSync('package-lock.json')) throw new Error('package-lock.json was not created'); const p=require('./package-lock.json'); if(p.lockfileVersion!==3) throw new Error('lockfileVersion must be 3')"
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add backend npm lockfile v3'
          git push
