name: Fix AUREXA beta compile blockers
on:
  push:
    branches: [beta/antifraud-staging-20260910]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - run: node scripts/fix-beta-compile.mjs
      - run: |
          if git diff --quiet; then echo 'No compile fixes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/aurexaData.ts tests/aurexa.test.ts
          git commit -m 'fix: remove client-private config and restore public compile contracts'
          git push
