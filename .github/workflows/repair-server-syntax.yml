name: repair-server-syntax
on:
  push:
    branches: [main]
    paths: [server.js]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair known typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          s=s.replace(".replace(/\\/+$/');", ".replace(/\\/+$/,'');")
          p.write_text(s)
          PY
      - name: Validate syntax
        run: node --check server.js
      - name: Commit repair
        run: |
          git config user.name 'aurexa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair backend server syntax'
          git push