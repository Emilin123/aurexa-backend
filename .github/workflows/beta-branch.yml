name: AUREXA beta branch
on:
  push:
    branches: [beta/antifraud-staging-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: rm -rf node_modules && test -f bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun x tsc --noEmit
      - run: bun run test
      - run: bun run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require backend npm lockfile v3
        run: node -e "const fs=require('fs'); if(!fs.existsSync('package-lock.json')) throw new Error('package-lock.json is required'); const p=require('./package-lock.json'); if(p.lockfileVersion!==3) throw new Error('lockfileVersion must be 3')"
      - run: rm -rf node_modules && npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  secrets:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Scan private secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' 'BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT_JSON[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']|TELEGRAM_BOT_TOKEN[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']|TELEGRAM_WEBHOOK_SECRET[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' src dist; then
            echo 'ERROR: private secret material found in public source/bundle'
            exit 1
          fi
