name: AUREXA beta branch
on:
  push:
    branches: [beta/antifraud-staging-20260910]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: rm -rf node_modules && test -f bun.lock && test ! -f package-lock.json
      - run: bun install --frozen-lockfile
      - run: test ! -f package-lock.json
      - run: bun run lint
      - run: bun x tsc --noEmit
      - name: frontend-tests-or-equivalent
        shell: bash
        run: |
          if bun run test >/tmp/t 2>&1; then cat /tmp/t; elif grep -qiE 'script.*test.*not found|command.*test.*not found' /tmp/t; then echo 'No frontend test script; type-check and production build are the equivalent baseline.'; else cat /tmp/t; exit 1; fi
      - run: bun run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require or reproducibly create backend npm lockfile v3
        shell: bash
        run: |
          if test ! -f package-lock.json; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) throw new Error('lockfileVersion must be 3')"
      - run: rm -rf node_modules && npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  secrets:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Scan private secret patterns
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' 'BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT_JSON[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']|TELEGRAM_BOT_TOKEN[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']|TELEGRAM_WEBHOOK_SECRET[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' src dist
