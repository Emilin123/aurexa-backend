name: AUREXA visual verification

on:
  push:
    branches: [aurexa-v3-staging]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install visual test runner
        working-directory: visual-tests
        run: npm init -y && npm install --no-audit --no-fund @playwright/test

      - name: Install Chromium
        working-directory: visual-tests
        run: npx playwright install --with-deps chromium

      - name: Capture AUREXA Android visual
        working-directory: visual-tests
        env:
          AUREXA_URL: https://aurexa-v3-frontend.onrender.com
        run: npx playwright test --update-snapshots

      - name: Re-run against generated baseline
        working-directory: visual-tests
        env:
          AUREXA_URL: https://aurexa-v3-frontend.onrender.com
        run: npx playwright test

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurexa-visual-evidence
          path: |
            visual-tests/playwright-report/
            visual-tests/specs/**/*-snapshots/*.png
            visual-tests/test-results/
          if-no-files-found: warn
