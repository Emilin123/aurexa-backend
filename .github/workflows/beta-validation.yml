name: AUREXA Beta Validation

on:
  push:
    branches:
      - google-studio-import-20260909
  pull_request:
    branches:
      - google-studio-import-20260909
  workflow_dispatch:
    inputs:
      stage:
        description: Validation stage (informational; code is always validated as checked out)
        required: false
        default: original
        type: choice
        options:
          - original
          - patch-a
          - patch-b
          - integrated

permissions:
  contents: read

concurrency:
  group: aurexa-beta-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-bun:
    name: Frontend / Bun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Show runtime
        run: |
          bun --version
          node --version

      - name: Require Bun lockfile and capture npm lockfile state
        shell: bash
        run: |
          test -f bun.lock
          test -f package.json
          if test -f package-lock.json; then
            sha256sum package-lock.json > /tmp/package-lock.before
          else
            printf 'ABSENT\n' > /tmp/package-lock.before
          fi

      - name: Clean dependency directory
        run: rm -rf node_modules

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Bun did not create or modify package-lock.json
        shell: bash
        run: |
          if test -f package-lock.json; then
            sha256sum -c /tmp/package-lock.before
          else
            test "$(cat /tmp/package-lock.before)" = "ABSENT"
          fi

      - name: Lint
        run: bun run lint

      - name: Type-check
        shell: bash
        run: |
          if bun run --silent type-check >/tmp/typecheck.out 2>&1; then
            cat /tmp/typecheck.out
          else
            rc=$?
            if grep -qE 'Script "type-check" not found|script "type-check" not found' /tmp/typecheck.out; then
              echo 'No type-check script is defined; using the repository TypeScript compiler directly.'
              bun x tsc --noEmit
            else
              cat /tmp/typecheck.out
              exit "$rc"
            fi
          fi

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  backend-npm:
    name: Backend / Node 22 + npm ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Require backend lockfile
        run: test -f package-lock.json

      - name: Clean dependency directory
        run: rm -rf node_modules

      - name: Install backend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  no-public-secrets:
    name: Bundle / secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-bun, backend-npm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Clean dependency directory
        run: rm -rf node_modules

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Reject obvious private-secret material in source and build output
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' \
            'BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY|serviceAccount[^A-Za-z0-9_]*[:=][[:space:]]*["'"'][^"'"']+["'"']|TELEGRAM_BOT_TOKEN[^A-Za-z0-9_]*[:=][[:space:]]*["'"'][^"'"']+["'"']|FIREBASE_SERVICE_ACCOUNT_JSON[^A-Za-z0-9_]*[:=][[:space:]]*["'"'][^"'"']+["'"']' \
            . dist; then
            echo 'ERROR: possible private secret found in source or bundle.'
            exit 1
          fi
