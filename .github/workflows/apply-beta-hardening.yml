name: Apply AUREXA beta hardening
on:
  push:
    branches: [beta/antifraud-staging-20260910]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node scripts/apply-beta-hardening.mjs
      - name: Commit hardening changes
        shell: bash
        run: |
          if git diff --quiet; then echo 'No hardening changes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/MiningView.tsx
          git commit -m 'feat: enforce server-authoritative beta operations'
          git push
