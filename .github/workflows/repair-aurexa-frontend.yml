name: Repair AUREXA syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair known syntax issues
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-beta-final.js')
          if p.exists():
              s=p.read_text()
              for k in ['invalid-credential','wrong-password','user-not-found','invalid-email','too-many-requests','invalid-action-code','expired-action-code','unauthorized-continue-uri']:
                  s=s.replace(k+':', "'"+k+"':")
              p.write_text(s)
          p=Path('server.js')
          if p.exists():
              s=p.read_text()
              s=s.replace(".replace(/\\/+$/');", ".replace(/\\/+$/,'');")
              p.write_text(s)
          PY
          node --check server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-beta-final.js server.js
          if git diff --cached --quiet; then echo 'No repair needed'; exit 0; fi
          git commit -m 'fix: repair frontend and backend syntax'
          git push